[package]
name = "xy_wasm_crypto"
version = "1.0.0"
edition = "2024"
authors = ["XY Runner Community Developers"]
description = "Official WebAssembly Demo Plugin: High-performance Hash, Base64 & URL Codec Suite"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]


[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
md-5 = "0.10"
sha1 = "0.10"
base64 = "0.22"
hex = "0.4"
urlencoding = "2.1"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Maximize optimizations
panic = "abort"     # Remove panic unwinding to shrink binary size
strip = true        # Automatically strip symbols from binary
